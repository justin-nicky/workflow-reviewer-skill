name: test
on: [push, pull_request]
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Run the tests
        shell: bash
        run: |
          set +e
          python -m pytest -q -rf --tb=line 2>&1 | tee pytest-out.txt
          code=${PIPESTATUS[0]}
          # failures become annotations, which are readable without signing in
          grep -E "^(FAILED|ERROR)|Error" pytest-out.txt | head -30 | cut -c1-400 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $code
