# Codex rollout mapping. Data only: dotted paths, [] wildcards, [k=v] filters.
host = "codex"
tested_versions = "0.137.0-alpha.4 to 0.142.2 (cli_version)"
type_path = ["type", "payload.type"]

[capabilities]
has_tokens = true
has_timestamps = true
has_tool_results = true
has_ids = false

[fields]
timestamp = "timestamp"
version = "payload.cli_version"

# A real user turn is an event_msg user_message. The user-role response items Codex
# injects (environment context, instructions) are not turns.
[[records]]
match = { type = "event_msg", "payload.type" = "user_message" }
role = "user"
text = ["payload.message"]

[[records]]
match = { type = "response_item", "payload.type" = "message", "payload.role" = ["user", "developer"] }
role = "ignore"

[[records]]
match = { type = "response_item", "payload.type" = "message", "payload.role" = "assistant" }
role = "assistant"
text = ["payload.content[].text"]

[[records]]
match = { type = "response_item", "payload.type" = ["function_call", "custom_tool_call", "local_shell_call"] }
role = "assistant"
calls = "payload"
call_name = "name"
call_input = "arguments"
call_id = "call_id"

[[records]]
match = { type = "response_item", "payload.type" = ["function_call_output", "custom_tool_call_output"] }
role = "user"
results = "payload"
result_id = "call_id"
result_exit_code = "output.metadata.exit_code"
result_exit_code_regex = "Process exited with code (-?\\d+)"
result_text = ["output.output", "output"]

[[records]]
match = { type = "event_msg", "payload.type" = "token_count" }
role = "meta"
usage_input = "payload.info.last_token_usage.input_tokens"
usage_output = "payload.info.last_token_usage.output_tokens"
usage_cache_read = "payload.info.last_token_usage.cached_input_tokens"
usage_input_includes_cache = true
usage_dedupe_key = "payload.info.total_token_usage"

# Only user-initiated aborts count as interruptions; other abort reasons stay ignored (and visible).
[[records]]
match = { type = "event_msg", "payload.type" = "turn_aborted", "payload.reason" = "interrupted" }
role = "meta"
interrupt = true

[[records]]
match = { type = ["session_meta", "turn_context", "event_msg", "compacted"] }
role = "ignore"

[[records]]
match = { type = "response_item", "payload.type" = ["reasoning", "web_search_call", "ghost_snapshot"] }
role = "ignore"
