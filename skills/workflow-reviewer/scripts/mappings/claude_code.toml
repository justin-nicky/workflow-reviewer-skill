# Claude Code transcript mapping. Data only: dotted paths, [] wildcards, [k=v] filters.
host = "claude-code"
schema_version = 1
variant = "default"
tested_versions = "2.1.295 to 2.1.309, 2.1.321"
type_path = "type"
# Claude Code sets CLAUDECODE in the environment of everything it runs (name only; verified in a live session).
detect = { env = ["CLAUDECODE"] }
turnless_activity = "broken"       # assistant records in the main session but no turn: the turn marker is gone
hooks_format = "claude-settings"      # the shape of the files listed under hook_files

interruption_prefixes = ["[Request interrupted by user"]

# User records that are not prompts from the human. Matched by prefix after the flag rules.
not_a_turn_prefixes = [
  "<local-command-stdout>", "<local-command-stderr>", "<local-command-caveat>",
  "<bash-input>", "<bash-stdout>", "<bash-stderr>",
  "<task-notification>", "<system-reminder>", "[Request interrupted by user",
]

# Second counts: each metric counted again from different records. All must agree on every session.
[[checks]]
name = "tool calls: at least 95% of tool_use ids have a tool_result"
metric = "tool_calls"
first = "calls_with_result_pct"
second = { const = 95 }
relation = "at_least"

[[checks]]
name = "tool calls: no tool_use id counted twice"
metric = "tool_calls"
first = "duplicate_calls"
second = { const = 0 }
severity = "warn"                   # a resumed session repeats earlier ids; each call is counted once, and this notes it

[[skill_folders]]
path = ".claude/skills"
scope = "project"
[[skill_folders]]
path = "skills"
base = "~/.claude"
base_env = "CLAUDE_CONFIG_DIR"
scope = "user"

# Plugin skills are scanned for overlaps only (not listed in the inventory above).
# The desktop app keeps plugin skills in its own data folder (macOS path; other systems are unverified).
[[plugin_skill_folders]]
path = "local-agent-mode-sessions/skills-plugin/*/*/skills"
base = "~/Library/Application Support/Claude"
glob = true
scope = "plugin"
[[plugin_skill_folders]]
path = "local-agent-mode-sessions/*/*/rpm/*/skills"
base = "~/Library/Application Support/Claude"
glob = true
scope = "plugin"
[[plugin_skill_folders]]
path = "local-agent-mode-sessions/*/*/rpm/*/skills/*"
base = "~/Library/Application Support/Claude"
glob = true
scope = "plugin"

# Hook files (settings), read for the overlap scan: event, matcher and the command's first word only.
[[hook_files]]
path = ".claude/settings.json"
scope = "project"
walk = false
[[hook_files]]
path = ".claude/settings.local.json"
scope = "project"
walk = false
[[hook_files]]
path = "settings.json"
base = "~/.claude"
base_env = "CLAUDE_CONFIG_DIR"
scope = "user"

# Where a subagent's sidecar file sits and which of its fields name the spawning call and model.
[subagents]
meta_file = "{stem}.meta.json"
file_prefix = "agent-"          # the agent id in a result's toolUseResult.agentId follows this prefix in the file name
call_id = "toolUseId"
model = "pickedEffortModel"

[capabilities]
has_tokens = true
has_timestamps = true
has_tool_results = true
has_ids = true

[fields]
timestamp = "timestamp"
event_id = "uuid"
msg_id = "message.id"
model = "message.model"
version = "version"

[[records]]
match = { type = "user", isMeta = true }
role = "user"
turn = false
non_turn_reason = "flag:isMeta"
text = ["message.content", "message.content[type=text].text"]
results = "message.content[type=tool_result]"
result_id = "tool_use_id"
result_error = "is_error"
result_text = "content"

[[records]]
match = { type = "user", isCompactSummary = true }
role = "user"
turn = false
non_turn_reason = "flag:isCompactSummary"
text = ["message.content", "message.content[type=text].text"]
results = "message.content[type=tool_result]"
result_id = "tool_use_id"
result_error = "is_error"
result_text = "content"

[[records]]
match = { type = "user", isVisibleInTranscriptOnly = true }
role = "user"
turn = false
non_turn_reason = "flag:isVisibleInTranscriptOnly"
text = ["message.content", "message.content[type=text].text"]
results = "message.content[type=tool_result]"
result_id = "tool_use_id"
result_error = "is_error"
result_text = "content"

[[records]]
match = { type = "user" }
role = "user"
text = ["message.content", "message.content[type=text].text"]
spawned_agent = "toolUseResult.agentId"
results = "message.content[type=tool_result]"
result_id = "tool_use_id"
result_error = "is_error"
result_text = "content"

[[records]]
match = { type = "assistant" }
role = "assistant"
text = ["message.content[type=text].text"]
usage_input = "message.usage.input_tokens"
usage_output = "message.usage.output_tokens"
usage_cache_read = "message.usage.cache_read_input_tokens"
usage_cache_write = "message.usage.cache_creation_input_tokens"
calls = "message.content[type=tool_use]"
call_name = "name"
call_input = "input"
call_id = "id"

# The skills offered to the model this session (explicit-only skills are absent from this list).
[[records]]
match = { type = "attachment", "attachment.type" = "skill_listing" }
role = "meta"
offered_skills = "attachment.names"
# The same record carries one "- name: description" line per offered skill.
offered_desc_from = "attachment.content"
offered_desc_item = "(?m)^- ([\\w:.\\-]+): (.*)$"

# Instruction files the host loaded (CLAUDE.md and the like), with their content, for the main session and each subagent.
[[records]]
match = { type = "attachment", "attachment.type" = "instructions" }
role = "meta"
instruction_items = { list = "attachment.files[]", path = "path", content = "content" }

[[records]]
match = { type = ["summary", "system", "file-history-snapshot", "queue-operation", "attachment", "progress", "last-prompt", "custom-title", "agent-name", "permission-mode", "pr-link", "api-request", "api-request-blob", "api-request-shape", "mode", "cost-state", "atis-latch", "bridge-session", "file-history-delta", "relocated", "tools-used", "ai-title", "data-flow-records"] }
role = "ignore"


# Claude Code 2.1.331 writes data-flow-records: entries that point at tool calls and responses already in the transcript.
# They carry no metric (ignored above); this check makes sure the tool calls they point at exist. A session without them skips it.
[[checks]]
name = "tool calls: data-flow tool_use_ids vs tool calls"
metric = "tool_calls"
first = { match = { type = "data-flow-records" }, distinct = "records[].tool_use_id", found_in = { match = { type = "assistant" }, path = "message.content[type=tool_use].id" } }
second = { match = { type = "data-flow-records" }, distinct = "records[].tool_use_id" }
skip_if_second_zero = true
severity = "warn"


# Entries that name a tool but point at no tool call (plugin and hook events): counted as a note, never as tool calls.
[[coverage_notes]]
match = { type = "data-flow-records" }
each = "records[]"
where = { tool_name = "$present", tool_use_id = "$absent" }
split = { plugins = { plugin_id = "$present" } }
text = "{count} data-flow entries name a tool with no matching call ({plugins} from plugins)"

# Responses they name that the transcript doesn't hold (the host's own side calls): a note, since the token totals
# count the transcript's calls and nothing is missing from them.
[[coverage_notes]]
match = { type = "data-flow-records" }
each = "records[]"
where = { response_id = "$present" }
distinct = "response_id"
not_found_in = { match = { type = "assistant" }, path = "message.id" }
text = "{count} model responses are referenced but not in the transcript (likely the host's side calls); token totals cover the transcript's calls only."
