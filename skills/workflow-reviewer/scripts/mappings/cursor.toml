# Cursor agent-transcript mapping (unofficial format). No tokens, timestamps, tool results or ids.
host = "cursor"
schema_version = 1
tested_versions = "version not recorded"
type_path = ["role", "type"]

[[skill_folders]]
path = ".cursor/skills"
scope = "project"
walk = false
[[skill_folders]]
path = "~/.cursor/skills"
scope = "user"
[[skill_folders]]
path = ".agents/skills"
scope = "project"
[[skill_folders]]
path = "~/.agents/skills"
scope = "user"
[[skill_folders]]
path = ".claude/skills"
scope = "project"
walk = false
[[skill_folders]]
path = "~/.claude/skills"
scope = "user"
[[skill_folders]]
path = ".codex/skills"
scope = "project"
walk = false

# The parent's assistant text links to each subagent by id: [description](<subagent-id>).
[subagents]
link_regex = "\\]\\(<?([0-9A-Fa-f-]{36})>?\\)"

[capabilities]
has_tokens = false
has_timestamps = false
has_tool_results = false
has_ids = false

[[records]]
match = { role = "user" }
role = "user"
text = ["message.content[type=text].text", "message.content"]
# Each prompt starts with <timestamp>Wednesday, Nov 11, 2026, 11:40 AM (UTC+4)</timestamp>.
prompt_time = { regex = "<timestamp>\\s*([^<(]*?)\\s*(?:\\(UTC([+-]\\d+)(?::(\\d+))?\\))?\\s*</timestamp>", format = "%A, %b %d, %Y, %I:%M %p" }

[[records]]
match = { role = "assistant" }
role = "assistant"
text = ["message.content[type=text].text"]
calls = "message.content[type=tool_use]"
call_name = "name"
call_input = "input"

# The user pressing stop is an interruption; any other error ending a turn is a turn error.
[[records]]
match = { type = "turn_ended", status = "error", error = "user_stopped_generation" }
role = "meta"
interrupt = true

[[records]]
match = { type = "turn_ended", status = "error" }
role = "meta"
turn_error = true

[[records]]
match = { type = "turn_ended" }
role = "ignore"
